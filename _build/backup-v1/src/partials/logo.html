<span class="logo">
        <!-- Drop your logo at assets/img/logo-white.png and it replaces the text logo automatically. -->
        <img class="logo-img h-10 w-auto sm:h-11" src="{{BASE}}assets/img/logo-white.png" alt="Skylink Global Network" width="160" height="44" onload="this.parentNode.classList.add('has-image')" onerror="this.remove()">
        <span class="logo-text">
          <span class="logo-word">Skylink</span>
          <span class="logo-sub">Global Network</span>
        </span>
      </span>
