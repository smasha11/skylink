<section class="hero-photo relative isolate overflow-hidden photo-fallback" aria-labelledby="cta-title">
      <img class="absolute inset-0 -z-10 h-full w-full object-cover object-[50%_60%]" src="{{BASE}}assets/img/highway-aerial-800.webp" srcset="{{BASE}}assets/img/highway-aerial-800.webp 800w, {{BASE}}assets/img/highway-aerial.webp 1600w" sizes="100vw" alt="" width="1600" height="900" loading="lazy" decoding="async" onerror="this.remove()">
      <div class="container-sk relative py-24 sm:py-32 lg:py-40">
        <h2 id="cta-title" class="ujumbe ujumbe-left max-w-4xl">Let's build strong business <span class="text-sk-yellow">connections together.</span></h2>
        <p class="lead measure mt-6 text-sk-white/85">Tell us what you need on WhatsApp. One message is enough to get started.</p>
        <div class="mt-10 flex flex-col gap-3 sm:flex-row sm:items-center">
          <a class="btn btn-wa btn-lg" href="https://wa.me/{{WA_NUMBER}}" target="_blank" rel="noopener"><i data-icon="whatsapp"></i> WhatsApp {{WA_DISPLAY}}</a>
          <a class="u-link inline-flex min-h-[48px] items-center px-2 text-sk-white" href="{{BASE}}contact.html">Other ways to reach us</a>
        </div>
      </div>
    </section>
