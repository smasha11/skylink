<!DOCTYPE html>
<html lang="en-KE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="robots" content="{{ROBOTS}}">
  <meta name="theme-color" content="#0A0A0A">
  <link rel="canonical" href="{{SITE_URL}}/{{PATH}}">

  <!-- Open Graph / Twitter -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Skylink Global Network">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:url" content="{{SITE_URL}}/{{PATH}}">
  <meta property="og:image" content="{{SITE_URL}}/assets/img/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="en_KE">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{TITLE}}">
  <meta name="twitter:description" content="{{DESCRIPTION}}">
  <meta name="twitter:image" content="{{SITE_URL}}/assets/img/og-image.jpg">

  <!-- Icons -->
  <link rel="icon" href="{{BASE}}assets/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{BASE}}assets/img/apple-touch-icon.png">

  <!-- Fonts (font-display: swap via &display=swap) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,700&display=swap">

  <link rel="stylesheet" href="{{BASE}}assets/css/style.css?v={{VERSION}}">
  <script>(function(d){d.classList.add('js');var t;try{t=localStorage.getItem('sk-theme')}catch(e){}d.setAttribute('data-theme',t==='light'?'light':'dark');})(document.documentElement)</script>
  <script src="{{BASE}}assets/js/main.js?v={{VERSION}}" defer></script>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "LocalBusiness",
    "@id": "{{SITE_URL}}/#business",
    "name": "Skylink Global Network",
    "alternateName": "Skylink WorldConnect",
    "slogan": "Real Connections. Real Movement.",
    "description": "Skylink Global Network connects truck owners with loads on routes across Africa (including return loads when available), cargo owners with suitable trucks, and buyers across Africa with verified suppliers.",
    "url": "{{SITE_URL}}/",
    "image": "{{SITE_URL}}/assets/img/og-image.jpg",
    "logo": "{{SITE_URL}}/assets/img/logo.png",
    "telephone": "+254757710635",
    "email": "{{EMAIL}}",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Nairobi",
      "addressCountry": "KE"
    },
    "areaServed": [
      { "@type": "Place", "name": "Africa" },
      { "@type": "Country", "name": "Kenya" },
      { "@type": "Country", "name": "Nigeria" }
    ],
    "sameAs": ["{{IG_URL}}", "{{FB_URL}}"],
    "founder": { "@type": "Person", "name": "Sara Mohamed" },
    "contactPoint": {
      "@type": "ContactPoint",
      "telephone": "+254757710635",
      "contactType": "customer service",
      "availableLanguage": ["English"],
      "url": "https://wa.me/{{WA_NUMBER}}"
    }
  }
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <!--@ header -->
  <main id="main">
<!--CONTENT-->
  </main>
  <!--@ footer -->
  <a class="wa-float" href="https://wa.me/{{WA_NUMBER}}" target="_blank" rel="noopener" aria-label="Chat with Skylink on WhatsApp">
    <i data-icon="whatsapp"></i>
  </a>
</body>
</html>
